site_name: FreeRTOS Mastery Path
site_description: A structured, module-wise FreeRTOS training program from entry level to master level — tasks, queues, semaphores, interrupts, and real-time design, every example runnable free in the Wokwi ESP32 simulator, no hardware required.
site_url: https://sigilipelli.github.io/freertos-mastery-path/
repo_url: https://github.com/SIGILIPELLI/freertos-mastery-path
repo_name: freertos-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · Why an RTOS?": level-1/01-why-an-rtos.md
      - "02 · Your First Tasks": level-1/02-first-tasks.md
      - "03 · The Scheduler": level-1/03-the-scheduler.md
      - "04 · Queues": level-1/04-queues.md
      - "05 · Semaphores & Mutexes": level-1/05-semaphores-mutexes.md
      - "06 · Software Timers": level-1/06-software-timers.md
      - "07 · Task Notifications & Event Groups": level-1/07-notifications-event-groups.md
      - "08 · Interrupts & the RTOS": level-1/08-interrupts.md
      - "09 · Memory & Debugging": level-1/09-memory-debugging.md
      - "10 · Capstone — Smart Sensor Device": level-1/10-capstone-project.md
# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-2/*.md
  level-3/*.md
  level-4/*.md
